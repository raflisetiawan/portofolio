# Installed to /etc/nginx/sites-available/portfolio.

limit_req_zone $binary_remote_addr zone=portfolio_chat:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name raflisetiawan.tech www.raflisetiawan.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://raflisetiawan.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.raflisetiawan.tech;

    ssl_certificate /etc/letsencrypt/live/raflisetiawan.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raflisetiawan.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    return 301 https://raflisetiawan.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raflisetiawan.tech;

    root /var/www/portfolio/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/raflisetiawan.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raflisetiawan.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log;

    # A week for now: raise it once HTTPS has proven stable. Subdomains are left out on purpose.
    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/chat {
        limit_req zone=portfolio_chat burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwritten, not appended, so a visitor can't spoof the address used for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in these file names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=604800" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
