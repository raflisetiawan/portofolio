# First stage, used only until the certificate exists: serves the ACME challenge over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name raflisetiawan.tech www.raflisetiawan.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
